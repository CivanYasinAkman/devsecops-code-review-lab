name: "DevSecOps Security Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_DEFAULT_VERSION: 24

jobs:
  sast-semgrep:
    name: "SAST - Semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Run Semgrep"
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

      - name: "Run Semgrep (JSON output for gate)"
        run: |
          pip install semgrep
          semgrep --config auto --json --output semgrep-results.json juice-shop/ || true

      - name: "Upload Semgrep results"
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: "Severity Gate - Fail on ERROR severity"
        run: |
          ERROR_COUNT=$(python3 -c "import json; data=json.load(open('semgrep-results.json')); print(sum(1 for r in data.get('results', []) if r.get('extra', {}).get('severity') == 'ERROR'))")
          echo "Semgrep ERROR severity findings: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::Build failed: $ERROR_COUNT critical Semgrep finding(s) detected."
            exit 1
          fi

  sca-npm-audit:
    name: "SCA - npm audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}

      - name: "npm audit (backend)"
        working-directory: juice-shop
        run: npm audit --audit-level=critical
        continue-on-error: false

      - name: "npm audit (frontend)"
        working-directory: juice-shop/frontend
        run: npm audit --audit-level=critical
        continue-on-error: false

  secret-scanning:
    name: "Secret Scanning - Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Gitleaks"
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: "Run Gitleaks"
        run: gitleaks detect --source . --report-format json --report-path gitleaks-results.json --exit-code 0

      - name: "Upload Gitleaks results"
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json

  container-scan:
    name: "Container Scan - Trivy"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Build Docker image"
        working-directory: juice-shop
        run: docker build -t juice-shop:ci .

      - name: "Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'